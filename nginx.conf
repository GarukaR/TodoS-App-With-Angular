server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression (Highly recommended for Angular bundles)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        # Try files, then folders, then fall back to index.html for SPA routing
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets (images, fonts) to improve performance
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6d;
        add_header Cache-Control "public";
    }

    # Security: Don't allow access to hidden files (like .htaccess)
    location ~ /\. {
        deny all;
    }
}
